services:
  postgres:
    image: pgvector/pgvector:pg17-trixie
    container_name: aiqa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-123456}
      POSTGRES_DB: ${POSTGRES_DB:-Ai-QA}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - /opt/data/ai-qa/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-Ai-QA}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4
    container_name: aiqa-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-123456} --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - /opt/data/ai-qa/redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:-123456} ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    container_name: aiqa-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_API_PORT:-9100}:9000"
      - "${MINIO_CONSOLE_PORT:-9101}:9001"
    volumes:
      - /opt/data/ai-qa/minio:/data

  rocketmq-namesrv:
    image: apache/rocketmq:5.3.2
    container_name: aiqa-rocketmq-namesrv
    restart: unless-stopped
    command: sh mqnamesrv
    ports:
      - "${ROCKETMQ_NAME_SERVER_PORT:-9876}:9876"

  rocketmq-broker:
    image: apache/rocketmq:5.3.2
    container_name: aiqa-rocketmq-broker
    restart: unless-stopped
    depends_on:
      - rocketmq-namesrv
    environment:
      NAMESRV_ADDR: rocketmq-namesrv:9876
      JAVA_OPT_EXT: ${ROCKETMQ_JAVA_OPT_EXT:--server -Xms512m -Xmx512m -Xmn256m}
    command: sh mqbroker -n rocketmq-namesrv:9876 -c /home/rocketmq/rocketmq-5.3.2/conf/broker.conf
    ports:
      - "${ROCKETMQ_BROKER_HA_PORT:-10909}:10909"
      - "${ROCKETMQ_BROKER_PORT:-10911}:10911"
      - "${ROCKETMQ_BROKER_FAST_PORT:-10912}:10912"
    volumes:
      - ./deploy/rocketmq/broker.conf:/home/rocketmq/rocketmq-5.3.2/conf/broker.conf
      - /opt/data/ai-qa/rocketmq/broker:/home/rocketmq/store
      - /opt/logs/rocketmq:/home/rocketmq/logs

  rocketmq-dashboard:
    profiles:
      - ops
    image: apacherocketmq/rocketmq-dashboard:latest
    container_name: aiqa-rocketmq-dashboard
    restart: unless-stopped
    depends_on:
      - rocketmq-namesrv
      - rocketmq-broker
    environment:
      JAVA_OPTS: -Drocketmq.namesrv.addr=rocketmq-namesrv:9876
    ports:
      - "${ROCKETMQ_DASHBOARD_PORT:-18080}:8080"

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aiqa-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      rocketmq-namesrv:
        condition: service_started
      rocketmq-broker:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-Ai-QA}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-123456}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-123456}
      SPRING_AI_OPENAI_API_KEY: ${QWEN_API_KEY}
      AI_DOCUMENT_STORAGE_TYPE: minio
      AI_DOCUMENT_STORAGE_MINIO_ENDPOINT: http://minio:9000
      AI_DOCUMENT_STORAGE_MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      AI_DOCUMENT_STORAGE_MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      AI_DOCUMENT_STORAGE_MINIO_BUCKET: ${MINIO_BUCKET:-aiqa-documents}
      AI_DOCUMENT_PROCESS_MQ_ENABLED: "true"
      AI_DOCUMENT_PROCESS_NAME_SERVER: rocketmq-namesrv:9876
      JAVA_OPTS: ${JAVA_OPTS:--Xms512m -Xmx1024m}
    ports:
      - "${BACKEND_PORT:-7000}:7000"
    volumes:
      - /opt/logs/ai-qa:/opt/logs/ai-qa

  nginx:
    build:
      context: ./ui
      dockerfile: Dockerfile
    container_name: aiqa-nginx
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - /opt/logs/nginx:/var/log/nginx

  portainer:
    profiles:
      - ops
    image: portainer/portainer-ce:lts
    container_name: aiqa-portainer
    restart: unless-stopped
    ports:
      - "${PORTAINER_HTTP_PORT:-9000}:9000"
      - "${PORTAINER_HTTPS_PORT:-9443}:9443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data

volumes:
  portainer_data:
