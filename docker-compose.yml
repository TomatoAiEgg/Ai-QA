services:
  susan-ai-pgvector:
    image: pgvector/pgvector:pg16
    container_name: susan-ai-pgvector
    ports:
      - "15432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=susan_ai
    volumes:
      - susan-ai-pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  susan-ai-redis:
    image: redis:7-alpine
    container_name: susan-ai-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - susan-ai-redis-data:/data
    restart: unless-stopped

volumes:
  susan-ai-pgdata:
  susan-ai-redis-data:
