spring.application.name=AI-QA
server.port=7000
#spring.ai.zhipuai.api-key=your-api-key

# PostgreSQL Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/susan_ai
spring.datasource.username=postgres
spring.datasource.password=123456
spring.datasource.driver-class-name=org.postgresql.Driver
spring.sql.init.mode=always

# Vector Store Configuration
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.table-name=vector_store_1024
spring.ai.vectorstore.pgvector.dimension=1024

# Alibaba Qwen (DashScope OpenAI-compatible API)
spring.ai.openai.enabled=true
spring.ai.openai.api-key=${QWEN_API_KEY}
spring.ai.openai.embedding.options.model=text-embedding-v3
spring.ai.openai.base-url=https://dashscope.aliyuncs.com/compatible-mode
spring.ai.openai.chat.options.model=qwen-vl-plus-latest
# ???????
spring.ai.openai.chat.options.timeout=120
spring.ai.openai.connection-pool.max-idle=10
spring.ai.openai.connection-pool.keep-alive=300

spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Document Splitter Configuration
ai.service.document.splitter.default-chunk-size=512
ai.service.document.splitter.min-chunk-size-chars=128
ai.service.document.splitter.min-chunk-length-to-embed=5
ai.service.document.splitter.max-num-chunks=10000
ai.service.document.splitter.keep-separator=true

# Rerank Configuration
ai.service.rerank.enabled=true
ai.service.rerank.model=qwen3-rerank
ai.service.rerank.min-score=0.5
ai.service.rerank.top-n=3

mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.global-config.banner=false
mybatis-plus.type-handlers-package=cn.net.tomatoegg.ai.handler
