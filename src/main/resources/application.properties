spring.application.name=AI-QA
server.port=7000
#spring.ai.zhipuai.api-key=你自己申请的智谱AI大模型的key

#spring.ai.ollama.base-url=http://localhost:11434
#spring.ai.ollama.chat.model=deepseek-r1:8b
#spring.ai.ollama.embedding.model=nomic-embed-text

# PostgreSQL Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/susan_ai
spring.datasource.username=postgres
spring.datasource.password=123456
spring.datasource.driver-class-name=org.postgresql.Driver

# Vector Store Configuration
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.initialize-schema=true
# 强制使用新表名，避免旧表维度冲突
spring.ai.vectorstore.pgvector.table-name=vector_store_768
spring.ai.vectorstore.pgvector.dimension=768
# 阿里千问（DashScope 兼容 OpenAI 接口�?
# 配置后默认在页面中选择千问模型回答问题
spring.ai.openai.enabled=true
spring.ai.openai.api-key=${QWEN_API_KEY}
spring.ai.openai.embedding.options.model=text-embedding-v3
spring.ai.openai.base-url=https://dashscope.aliyuncs.com/compatible-mode
spring.ai.openai.chat.options.model=qvq-max-2025-03-25

spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Document Splitter Configuration
ai.service.document.splitter.default-chunk-size=512
ai.service.document.splitter.min-chunk-size-chars=128
ai.service.document.splitter.min-chunk-length-to-embed=5
ai.service.document.splitter.max-num-chunks=10000
ai.service.document.splitter.keep-separator=true

# Rerank Configuration
ai.service.rerank.enabled=true
ai.service.rerank.model=qwen3-rerank
ai.service.rerank.min-score=0.5
ai.service.rerank.top-n=3
