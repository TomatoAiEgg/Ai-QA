spring.application.name=AI-QA
server.port=7000
logging.config=classpath:logback-spring.xml
# 可通过环境变量 LOG_PATH 覆盖，默认输出到项目根目录 logs/
# LOG_PATH=/opt/logs/ai-qa
#spring.ai.zhipuai.api-key=your-api-key

# PostgreSQL Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/Ai-QA
spring.datasource.username=postgres
spring.datasource.password=123456
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.type=com.zaxxer.hikari.HikariDataSource
spring.datasource.hikari.pool-name=AiQaHikariPool
spring.datasource.hikari.maximum-pool-size=12
spring.datasource.hikari.minimum-idle=4
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.validation-timeout=1000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.keepalive-time=300000
spring.datasource.hikari.leak-detection-threshold=60000
spring.datasource.hikari.data-source-properties.reWriteBatchedInserts=true
spring.sql.init.mode=never

spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=${REDIS_PASSWORD:123456}
spring.data.redis.database=0
spring.data.redis.timeout=5s
spring.cache.type=redis
spring.cache.redis.time-to-live=30m
spring.cache.redis.cache-null-values=false

# Alibaba Qwen (DashScope OpenAI-compatible API)
spring.ai.openai.enabled=true
spring.ai.openai.api-key=${QWEN_API_KEY}
spring.ai.openai.embedding.options.model=text-embedding-v3
spring.ai.openai.base-url=https://dashscope.aliyuncs.com/compatible-mode
spring.ai.openai.chat.options.model=qwen-vl-plus-latest
# ???????
spring.ai.openai.chat.options.timeout=120
spring.ai.openai.connection-pool.max-idle=10
spring.ai.openai.connection-pool.keep-alive=300

spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Document Splitter Configuration
ai.service.document.splitter.default-chunk-size=512
ai.service.document.splitter.min-chunk-size-chars=128
ai.service.document.splitter.min-chunk-length-to-embed=5
ai.service.document.splitter.max-num-chunks=10000
ai.service.document.splitter.keep-separator=true

# Rerank Configuration
ai.service.rerank.enabled=true
ai.service.rerank.model=qwen3-rerank
ai.service.rerank.min-score=0.5
ai.service.rerank.top-n=3

mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.global-config.banner=false
mybatis-plus.type-handlers-package=cn.net.tomatoegg.ai.handler

sa-token.token-name=aiqa-token
sa-token.timeout=604800
sa-token.active-timeout=-1
sa-token.is-concurrent=true
sa-token.is-share=true
sa-token.token-style=uuid
sa-token.is-read-cookie=true
sa-token.is-read-header=true
