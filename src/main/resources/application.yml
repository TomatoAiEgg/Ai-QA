spring:
  application:
    name: AI-QA
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/Ai-QA}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:123456}
    driver-class-name: org.postgresql.Driver
    type: com.zaxxer.hikari.HikariDataSource
    hikari:
      pool-name: AiQaHikariPool
      maximum-pool-size: 12
      minimum-idle: 4
      connection-timeout: 3000
      validation-timeout: 1000
      idle-timeout: 600000
      max-lifetime: 1800000
      keepalive-time: 300000
      leak-detection-threshold: 60000
      data-source-properties:
        reWriteBatchedInserts: true
  sql:
    init:
      mode: never
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:123456}
      database: 0
      timeout: 5s
  cache:
    type: redis
    redis:
      time-to-live: 30m
      cache-null-values: false
  ai:
    openai:
      enabled: true
      api-key: ${SPRING_AI_OPENAI_API_KEY:${QWEN_API_KEY:}}
      embedding:
        options:
          model: text-embedding-v3
      base-url: https://dashscope.aliyuncs.com/compatible-mode
      chat:
        options:
          model: qwen-vl-plus-latest
          timeout: 120
      connection-pool:
        max-idle: 10
        keep-alive: 300
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html

server:
  port: 7000

logging:
  config: classpath:logback-spring.xml

ai:
  service:
    document:
      splitter:
        default-chunk-size: 512
        min-chunk-size-chars: 128
        min-chunk-length-to-embed: 5
        max-num-chunks: 10000
        keep-separator: true
    rerank:
      enabled: true
      model: qwen3-rerank
      min-score: 0.5
      top-n: 3

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
  type-handlers-package: cn.net.tomatoegg.ai.handler

sa-token:
  token-name: aiqa-token
  timeout: 604800
  active-timeout: -1
  is-concurrent: true
  is-share: true
  token-style: uuid
  is-read-cookie: true
  is-read-header: true
