<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAG 知识库管理</title>
    <style>
        :root {
            --primary-color: #5b8cff;
            --primary-dark: #3d6ef7;
            --success-color: #48bb78;
            --text-color: #2d3748;
            --bg-gradient: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            --card-bg: rgba(255, 255, 255, 0.95);
            --shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.1);
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            background: var(--bg-gradient);
            color: var(--text-color);
        }

        .container {
            width: 100%;
            max-width: 900px;
            background: var(--card-bg);
            border-radius: 24px;
            box-shadow: var(--shadow);
            padding: 48px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        h1 {
            color: #1a202c;
            margin-bottom: 40px;
            text-align: center;
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .upload-section {
            border: 2px dashed #e2e8f0;
            border-radius: 20px;
            padding: 60px;
            text-align: center;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            margin-bottom: 40px;
            background: #f8fafc;
            position: relative;
            overflow: hidden;
        }

        .upload-section.drag-over {
            border-color: var(--primary-color);
            background: #f0f7ff;
            transform: scale(1.02);
            box-shadow: 0 10px 25px -5px rgba(91, 140, 255, 0.25);
        }

        .upload-section:hover {
            border-color: var(--primary-color);
            background: #f0f7ff;
            transform: translateY(-2px);
            box-shadow: 0 10px 25px -5px rgba(91, 140, 255, 0.15);
        }

        .file-input {
            display: none;
        }

        .upload-btn {
            background: linear-gradient(135deg, #5b8cff 0%, #3d6ef7 100%);
            color: white;
            border: none;
            padding: 16px 40px;
            border-radius: 50px;
            cursor: pointer;
            font-size: 1.1rem;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(91, 140, 255, 0.3);
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .upload-btn svg {
            width: 24px;
            height: 24px;
            fill: currentColor;
        }

        .upload-btn:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 8px 25px rgba(91, 140, 255, 0.4);
        }

        .upload-btn:active {
            transform: translateY(0) scale(0.98);
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 40px;
            color: #718096;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.2s ease;
            padding: 10px 20px;
            border-radius: 12px;
        }

        .back-link:hover {
            color: var(--primary-color);
            background: rgba(91, 140, 255, 0.05);
        }

        #status {
            margin-top: 20px;
            text-align: center;
            font-weight: 600;
            min-height: 24px;
            padding: 10px;
            border-radius: 8px;
        }

        .success { color: #38a169; background: #f0fff4; display: inline-block; padding: 8px 16px !important; }
        .error { color: #e53e3e; background: #fff5f5; display: inline-block; padding: 8px 16px !important; }
        .loading { color: #3182ce; }

        .doc-list {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            margin-top: 20px;
        }

        .doc-list th {
            background: transparent;
            color: #718096;
            font-weight: 600;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            padding: 16px 24px;
            border-bottom: 2px solid #edf2f7;
            text-align: left;
        }

        .doc-list td {
            padding: 20px 24px;
            background: white;
            border-bottom: 1px solid #edf2f7;
            color: #4a5568;
            font-size: 0.95rem;
            transition: background 0.2s;
        }

        .doc-list tr:first-child td:first-child { border-top-left-radius: 12px; }
        .doc-list tr:first-child td:last-child { border-top-right-radius: 12px; }
        .doc-list tr:last-child td:first-child { border-bottom-left-radius: 12px; border-bottom: none; }
        .doc-list tr:last-child td:last-child { border-bottom-right-radius: 12px; border-bottom: none; }

        .doc-list tr:hover td {
            background: #f8fafc;
        }

        /* 切片预览弹窗样式 */
        .preview-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .preview-modal.active {
            display: flex;
        }

        .preview-content {
            background: white;
            border-radius: 16px;
            width: 90%;
            max-width: 800px;
            max-height: 80vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .preview-header {
            padding: 20px 24px;
            border-bottom: 1px solid #edf2f7;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .preview-header h3 {
            margin: 0;
            color: #1a202c;
            font-size: 1.2rem;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 1.5rem;
            color: #718096;
            cursor: pointer;
            padding: 4px;
            line-height: 1;
        }

        .close-btn:hover {
            color: #e53e3e;
        }

        .preview-body {
            padding: 24px;
            overflow-y: auto;
            flex: 1;
        }

        .chunk-item {
            background: #f8fafc;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 12px;
            border-left: 4px solid var(--primary-color);
        }

        .chunk-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 0.85rem;
            color: #718096;
        }

        .chunk-content {
            white-space: pre-wrap;
            word-break: break-word;
            color: #2d3748;
            font-size: 0.9rem;
            line-height: 1.6;
            max-height: 200px;
            overflow-y: auto;
        }

        .preview-stats {
            background: #edf2f7;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 16px;
            font-size: 0.9rem;
            color: #4a5568;
        }

        .preview-btn {
            background: linear-gradient(135deg, #48bb78 0%, #38a169 100%);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 50px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(72, 187, 120, 0.3);
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-left: 10px;
        }

        .preview-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(72, 187, 120, 0.4);
        }

        .action-cell {
            display: flex;
            align-items: center;
            gap: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>RAG 知识库管理</h1>

        <div class="upload-section">
            <input type="file" id="fileInput" class="file-input" accept=".txt,.md,.pdf,.docx">
            <label for="fileInput" class="upload-btn">
                <svg viewBox="0 0 24 24">
                    <path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM14 13v4h-4v-4H7l5-5 5 5h-3z"/>
                </svg>
                上传新文档
            </label>
            <p style="margin-top: 20px; color: #a0aec0; font-size: 0.9rem;">
                点击按钮或拖拽文件到此处上传<br>
                <span style="font-size: 0.8rem; opacity: 0.8">支持 TXT, Markdown, PDF, Word 文档</span>
            </p>
        </div>

        <div id="status"></div>

        <table class="doc-list" id="docList">
            <thead>
                <tr>
                    <th>文件名</th>
                    <th>切片数量</th>
                    <th>上传时间</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody>
                <!-- 文档列表将通过 JS 动态加载 -->
            </tbody>
        </table>

        <a href="/" class="back-link">
            <svg viewBox="0 0 24 24" style="width: 20px; height: 20px; fill: currentColor;">
                <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
            </svg>
            返回聊天首页
        </a>
    </div>

    <!-- 切片预览弹窗 -->
    <div class="preview-modal" id="previewModal">
        <div class="preview-content">
            <div class="preview-header">
                <h3>文档切片预览 - <span id="previewFilename"></span></h3>
                <button class="close-btn" onclick="closePreview()">×</button>
            </div>
            <div class="preview-body">
                <div class="preview-stats" id="previewStats"></div>
                <div id="previewChunks"></div>
            </div>
        </div>
    </div>

    <script>
        const fileInput = document.getElementById('fileInput');
        const statusDiv = document.getElementById('status');
        const docListBody = document.querySelector('#docList tbody');
        const uploadSection = document.querySelector('.upload-section');
        const previewModal = document.getElementById('previewModal');
        const previewFilename = document.getElementById('previewFilename');
        const previewStats = document.getElementById('previewStats');
        const previewChunks = document.getElementById('previewChunks');

        // 加载文档列表
        async function loadDocuments() {
            try {
                const response = await fetch('/ai/documents');
                const documents = await response.json();

                docListBody.innerHTML = documents.map(doc => `
                    <tr>
                        <td>${doc.filename || '未知文件'}</td>
                        <td>${doc.chunk_count}</td>
                        <td>${new Date(parseInt(doc.upload_time)).toLocaleString()}</td>
                        <td class="action-cell">
                            <button class="preview-btn" onclick="showPreview('${doc.filename}')">
                                <svg viewBox="0 0 24 24" style="width: 16px; height: 16px; fill: currentColor;">
                                    <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
                                </svg>
                                预览
                            </button>
                        </td>
                    </tr>
                `).join('');

                if (documents.length === 0) {
                    docListBody.innerHTML = '<tr><td colspan="4" style="text-align:center; color:#a0aec0;">暂无文档</td></tr>';
                }
            } catch (error) {
                console.error('加载文档列表失败', error);
            }
        }

        // 页面加载时获取列表
        loadDocuments();

        // 显示切片预览
        async function showPreview(filename) {
            previewFilename.textContent = filename;
            previewStats.textContent = '正在加载切片预览...';
            previewChunks.innerHTML = '';
            previewModal.classList.add('active');

            // 这里只是演示，实际需要后端提供预览接口
            // 由于已有上传后的数据，这里显示提示信息
            previewStats.innerHTML = '<strong>提示：</strong>切片预览功能需要在上传新文件时使用。已上传的文档请查看日志获取详细切片信息。';
            previewChunks.innerHTML = `
                <div class="chunk-item">
                    <div class="chunk-header">
                        <span>💡 使用说明</span>
                    </div>
                    <div class="chunk-content">
                        1. 上传新文件时，系统会自动显示切片预览<br>
                        2. 上传完成后，可在服务器日志中查看详细的切片统计信息<br>
                        3. 日志包含：平均切片大小、最小/最大切片数、重叠率等指标
                    </div>
                </div>
            `;
        }

        // 关闭预览
        function closePreview() {
            previewModal.classList.remove('active');
        }

        // 点击弹窗外部关闭
        previewModal.addEventListener('click', (e) => {
            if (e.target === previewModal) {
                closePreview();
            }
        });

        // 统一处理文件上传逻辑
        async function handleFileUpload(file) {
            if (!file) return;

            const formData = new FormData();
            formData.append('file', file);

            statusDiv.textContent = '正在上传处理中...';
            statusDiv.className = 'loading';

            try {
                // 先预览切片
                const previewResponse = await fetch('/ai/preview-chunks', {
                    method: 'POST',
                    body: formData
                });

                if (previewResponse.ok) {
                    const chunks = await previewResponse.json();
                    if (chunks.error) {
                        throw new Error(chunks.error);
                    }
                    // 显示预览弹窗
                    showUploadPreview(file.name, chunks);
                }

                // 然后正式上传
                const response = await fetch('/ai/upload', {
                    method: 'POST',
                    body: formData
                });

                const result = await response.text();

                if (response.ok) {
                    statusDiv.textContent = '✅ ' + result;
                    statusDiv.className = 'success';
                    // 上传成功后刷新列表
                    loadDocuments();
                } else {
                    throw new Error(result || '上传失败');
                }
            } catch (error) {
                statusDiv.textContent = '❌ ' + error.message;
                statusDiv.className = 'error';
            }
        }

        // 显示上传预览
        function showUploadPreview(filename, chunks) {
            previewFilename.textContent = filename;
            
            // 统计信息
            const totalChunks = chunks.length;
            const avgLength = Math.round(chunks.reduce((sum, c) => sum + c.length, 0) / totalChunks);
            const minLength = Math.min(...chunks.map(c => c.length));
            const maxLength = Math.max(...chunks.map(c => c.length));
            
            previewStats.innerHTML = `
                <strong>切片统计：</strong> 
                共 ${totalChunks} 个片段 | 
                平均长度：${avgLength} 字符 | 
                最小：${minLength} | 
                最大：${maxLength}
            `;

            // 渲染切片列表
            previewChunks.innerHTML = chunks.map(chunk => `
                <div class="chunk-item">
                    <div class="chunk-header">
                        <span>片段 #${chunk.index + 1}</span>
                        <span>${chunk.length} 字符</span>
                    </div>
                    <div class="chunk-content">${escapeHtml(chunk.content)}</div>
                </div>
            `).join('');

            previewModal.classList.add('active');
        }

        // HTML 转义
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // 点击上传处理
        fileInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            await handleFileUpload(file);
            // 清空选择，允许重复上传同名文件
            fileInput.value = '';
        });

        // 拖拽相关事件处理
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            uploadSection.addEventListener(eventName, preventDefaults, false);
        });

        function preventDefaults(e) {
            e.preventDefault();
            e.stopPropagation();
        }

        // Hide back link if in iframe
        if (window.self !== window.top) {
            const backLink = document.querySelector('.back-link');
            if (backLink) backLink.style.display = 'none';
            // Optional: Adjust container style for iframe
            document.body.style.padding = '20px';
            document.body.style.minHeight = 'auto';
            document.querySelector('.container').style.boxShadow = 'none';
            document.querySelector('.container').style.border = 'none';
        }

        ['dragenter', 'dragover'].forEach(eventName => {
            uploadSection.addEventListener(eventName, highlight, false);
        });

        ['dragleave', 'drop'].forEach(eventName => {
            uploadSection.addEventListener(eventName, unhighlight, false);
        });

        function highlight(e) {
            uploadSection.classList.add('drag-over');
        }

        function unhighlight(e) {
            uploadSection.classList.remove('drag-over');
        }

        uploadSection.addEventListener('drop', async (e) => {
            const dt = e.dataTransfer;
            const files = dt.files;

            if (files.length > 0) {
                await handleFileUpload(files[0]);
            }
        });
    </script>
</body>
</html>
